<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open YourApp</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: #fafafa;
      color: #333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #333;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Opening YourApp…</p>

  <script>
    const shareCode = new URLSearchParams(window.location.search).get('shareCode');
    const androidPackage = 'com.yourapp'; // replace with your real package name

    // Attempt to open the app
    const appUrl = `yourapp://invite?shareCode=${shareCode}`;
    window.location = appUrl;

    // If not installed, redirect to Play Store after 1.5s
    setTimeout(() => {
      window.location = `https://play.google.com/store/apps/details?id=${androidPackage}`;
    }, 1500);
  </script>
</body>
</html>
